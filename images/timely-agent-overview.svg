<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="timely-title timely-desc">
  <title id="timely-title">TIMELY-Agent workflow</title>
  <desc id="timely-desc">Four equal stages connect clinical knowledge, governed retrieval, reasoning episodes, and tasks and audit.</desc>
  <rect width="1200" height="630" fill="#f1f3f5"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="40" y="180" width="238" height="300" rx="18" fill="#ffffff" stroke="#005f73" stroke-width="3"/>
      <rect x="40" y="180" width="238" height="12" rx="6" fill="#0a9396"/>
      <text x="159" y="338" fill="#005f73" font-size="23" font-weight="700" text-anchor="middle">Clinical knowledge</text>
    </g>

    <g>
      <rect x="330" y="180" width="238" height="300" rx="18" fill="#ffffff" stroke="#005f73" stroke-width="3"/>
      <rect x="330" y="180" width="238" height="12" rx="6" fill="#0a9396"/>
      <text x="449" y="338" fill="#005f73" font-size="23" font-weight="700" text-anchor="middle">Governed retrieval</text>
    </g>

    <g>
      <rect x="620" y="180" width="238" height="300" rx="18" fill="#ffffff" stroke="#005f73" stroke-width="3"/>
      <rect x="620" y="180" width="238" height="12" rx="6" fill="#0a9396"/>
      <text x="739" y="338" fill="#005f73" font-size="23" font-weight="700" text-anchor="middle">Reasoning episodes</text>
    </g>

    <g>
      <rect x="910" y="180" width="238" height="300" rx="18" fill="#ffffff" stroke="#005f73" stroke-width="3"/>
      <rect x="910" y="180" width="238" height="12" rx="6" fill="#0a9396"/>
      <text x="1029" y="338" fill="#005f73" font-size="23" font-weight="700" text-anchor="middle">Tasks and audit</text>
    </g>
  </g>

  <g fill="#0a9396" stroke="#0a9396" stroke-linecap="round">
    <line x1="286" y1="330" x2="316" y2="330" stroke-width="6"/>
    <path d="M 314 318 L 326 330 L 314 342 Z" stroke="none"/>
    <line x1="576" y1="330" x2="606" y2="330" stroke-width="6"/>
    <path d="M 604 318 L 616 330 L 604 342 Z" stroke="none"/>
    <line x1="866" y1="330" x2="896" y2="330" stroke-width="6"/>
    <path d="M 894 318 L 906 330 L 894 342 Z" stroke="none"/>
  </g>
</svg>
